<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configure the Bike | BMX Cycle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="wrap">
    <input class="initial" type="checkbox" aria-label="Open bicycle configurator">
    <input class="wheel1" name="wheel" type="radio" aria-label="Wheel option 1">
    <input class="wheel2" name="wheel" type="radio" aria-label="Wheel option 2">
    <input class="wheel3" name="wheel" type="radio" aria-label="Wheel option 3">
    <input class="wheel4" name="wheel" type="radio" aria-label="Wheel option 4">
    <input class="buy" type="checkbox" aria-label="Add configured bike to cart">
    <h1>Configure the Bike</h1>
    <h2>Added to Cart Rs6999</h2>
    <h3>Wheels</h3>
    <div class="wheeltoggle"></div>
    <div class="wheeltoggle"></div>
    <div class="wheeltoggle"></div>
    <div class="wheeltoggle"></div>
    <div class="buy"></div>
    <div class="toggle expand" aria-hidden="true"><i class="fas fa-bicycle"></i></div>
    <div class="toggle" aria-hidden="true"><i class="fas fa-bicycle"></i></div>
    <div class="background" aria-hidden="true"></div>
    <div class="frame" role="img" aria-label="Configured BMX bicycle preview">
      <div class="rear"></div>
      <div class="stem"></div>
      <div class="shaft"></div>
      <div class="seat"></div>
      <div class="wheel one front"><div class="inner"></div></div>
      <div class="wheel one back"><div class="inner"></div></div>
    </div>
  </main>
</body>
</html>
